name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - '**'

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: AIzaSyDaDRpUyUGtQcpb7EOa3kyOECLJOx3c9Lk
          VITE_FIREBASE_AUTH_DOMAIN: flexspace-1.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: flexspace-1
          VITE_FIREBASE_STORAGE_BUCKET: flexspace-1.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: '544136326567'
          VITE_FIREBASE_APP_ID: '1:544136326567:web:eeab9a468ce0f82299da82'
          VITE_FIREBASE_MEASUREMENT_ID: G-LVT5RRD31W


      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: flexspace-1
          channelId: live
