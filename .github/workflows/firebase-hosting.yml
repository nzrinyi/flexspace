name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - "**"

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Test calculations
        run: npm test

      - name: Setup Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Test budget Firestore access rules
        shell: bash
        run: |
          set +e
          npm run test:firestore > "$RUNNER_TEMP/budget-rules-test.log" 2>&1
          test_status=$?
          set -e
          cat "$RUNNER_TEMP/budget-rules-test.log"
          if [ "$test_status" -ne 0 ]; then
            node <<'NODE'
          const fs = require('node:fs');
          const lines = fs.readFileSync(process.env.RUNNER_TEMP + '/budget-rules-test.log', 'utf8').split('\n');
          const messages = lines.filter(line => /not ok|error:|Error:|failureType:/.test(line)).slice(-12);
          for (const message of messages) console.log('::error::' + message.replace(/%/g, '%25').replace(/\r/g, '%0D').slice(0, 500));
          NODE
            exit "$test_status"
          fi
          echo '::notice::Budget Firestore access-rule tests passed against the demo emulator.'

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: AIzaSyDaDRpUyUGtQcpb7EOa3kyOECLJOx3c9Lk
          VITE_FIREBASE_AUTH_DOMAIN: flexspace-1.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: flexspace-1
          VITE_FIREBASE_STORAGE_BUCKET: flexspace-1.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "544136326567"
          VITE_FIREBASE_APP_ID: "1:544136326567:web:eeab9a468ce0f82299da82"
          VITE_FIREBASE_MEASUREMENT_ID: G-LVT5RRD31W

      - name: Deploy budget security rules
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node .github/scripts/deploy-budget-rules.cjs

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-hosting-credentials.json"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          node <<'NODE'
          const fs = require('node:fs');
          const raw = process.env.FIREBASE_SERVICE_ACCOUNT_JSON;
          if (!raw) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Deployment blocked: FIREBASE_SERVICE_ACCOUNT repository secret is missing.\n');
            process.exit(1);
          }
          let credentials;
          try { credentials = JSON.parse(raw); } catch {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Deployment blocked: FIREBASE_SERVICE_ACCOUNT is not valid JSON.\n');
            process.exit(1);
          }
          if (credentials.type !== 'service_account' || !credentials.private_key || !credentials.client_email) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Deployment blocked: FIREBASE_SERVICE_ACCOUNT must contain a complete Google service-account key.\n');
            process.exit(1);
          }
          fs.writeFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS, raw, { mode: 0o600 });
          NODE
          unset FIREBASE_SERVICE_ACCOUNT_JSON
          set +e
          # 15.34 adds a Service Usage preflight that requires extra IAM permissions.
          # Keep the official 15.33 CLI for this Hosting-only service account.
          npm exec --yes --package firebase-tools@15.33.0 -- firebase deploy --only hosting --project flexspace-1 --non-interactive > "$RUNNER_TEMP/firebase-deploy.log" 2>&1
          deploy_status=$?
          set -e
          cat "$RUNNER_TEMP/firebase-deploy.log"
          if [ "$deploy_status" -ne 0 ]; then
            node <<'NODE'
          const fs = require('node:fs');
          const log = fs.readFileSync(process.env.RUNNER_TEMP + '/firebase-deploy.log', 'utf8');
          const errors = log.split('\n').filter(line => /Error:|HTTP Error|Permission denied|Failed to authenticate/.test(line));
          // Never publish credentials or debug logs in the summary.
          const safe = errors.map(line => line.replace(/https?:\/\/\S+/g, '[URL]').replace(/Bearer\s+\S+/gi, 'Bearer [redacted]').slice(0, 600));
          for (const message of safe) console.log('::error::' + message.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A'));
          if (!safe.length) console.log('::error::Firebase CLI deployment failed; see deployment logs.');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Firebase Hosting deployment failed.\n\n' + (safe.length ? safe.join('\n') : 'See the deployment step logs.') + '\n');
          NODE
            exit "$deploy_status"
          fi
          echo 'Firebase Hosting deployed successfully to https://flexspace-1.web.app' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the published build
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const {setTimeout: wait} = require('node:timers/promises');
          const root = 'https://flexspace-1.firebaseapp.com';
          const hash = bytes => crypto.createHash('sha256').update(bytes).digest('hex');
          (async () => {
            for (let attempt=0; attempt<6; attempt++) {
              try {
                const response = await fetch(root + '/?app=budget&verify=' + process.env.GITHUB_SHA, { signal: AbortSignal.timeout(15000), headers:{'Cache-Control':'no-cache'} });
                if (!response.ok) throw new Error('Live page returned HTTP ' + response.status);
                const live = await response.text();
                const local = fs.readFileSync('dist/index.html','utf8');
                const assets = text => [...text.matchAll(/(?:src|href)="([^"]+\.(?:js|css))"/g)].map(match=>match[1]).sort().join('|');
                if (assets(live) !== assets(local)) throw new Error('Live HTML has not updated to this build yet.');
                for (const name of fs.readdirSync('dist/assets').filter(name=>/\.(?:js|css)$/.test(name))) {
                  const asset = await fetch(root + '/assets/' + name, {signal:AbortSignal.timeout(15000)});
                  if (!asset.ok || hash(Buffer.from(await asset.arrayBuffer())) !== hash(fs.readFileSync('dist/assets/'+name))) throw new Error('Live asset does not match: ' + name);
                }
                console.log('::notice::Published HTML and all JavaScript/CSS assets match this build.');
                return;
              } catch (error) {
                if (attempt===5) throw error;
                await wait(10000);
              }
            }
          })().catch(error=>{console.log('::error::' + error.message);process.exit(1);});
          NODE
