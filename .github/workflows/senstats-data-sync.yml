name: SenStats Daily Roster Data Sync

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-senstats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-senstats.txt

      - name: Install ingestion dependencies
        run: pip install -r scripts/requirements-senstats.txt

      - name: Run SenStats ingestion
        run: python scripts/senstats_ingest.py
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SENSTATS_CONTACT_EMAIL: ${{ secrets.SENSTATS_CONTACT_EMAIL }}
          SENSTATS_SYNC_EXPENSES: 'false'
          SENSTATS_PROACTIVE_XHR_URL: ${{ secrets.SENSTATS_PROACTIVE_XHR_URL || vars.SENSTATS_PROACTIVE_XHR_URL }}
          SENSTATS_MAX_PROACTIVE_XHR_ATTEMPTS: ${{ vars.SENSTATS_MAX_PROACTIVE_XHR_ATTEMPTS || '' }}
          SENSTATS_PROACTIVE_TIMEOUT: ${{ vars.SENSTATS_PROACTIVE_TIMEOUT || '' }}
          SENSTATS_PROACTIVE_ROUTE_FALLBACKS: ${{ vars.SENSTATS_PROACTIVE_ROUTE_FALLBACKS || '' }}
          SENSTATS_CHECK_STATIC_PROACTIVE_PAGES: ${{ vars.SENSTATS_CHECK_STATIC_PROACTIVE_PAGES || '' }}
          SENSTATS_STATIC_PROACTIVE_TIMEOUT: ${{ vars.SENSTATS_STATIC_PROACTIVE_TIMEOUT || '' }}
          SENSTATS_STATIC_PAGE_FAILURE_ABORT_AFTER: ${{ vars.SENSTATS_STATIC_PAGE_FAILURE_ABORT_AFTER || '' }}
          SENSTATS_USE_COMMITTEE_FALLBACK: ${{ vars.SENSTATS_USE_COMMITTEE_FALLBACK || '' }}
          SENSTATS_USE_SEEDED_COMMITTEE_FALLBACK: ${{ vars.SENSTATS_USE_SEEDED_COMMITTEE_FALLBACK || '' }}
          SENSTATS_USE_READER_COMMITTEE_FALLBACK: ${{ vars.SENSTATS_USE_READER_COMMITTEE_FALLBACK || '' }}
          SENSTATS_COMMITTEE_IDS: ${{ vars.SENSTATS_COMMITTEE_IDS || '' }}
          SENSTATS_COMMITTEE_FOCUS_CODES: 'AEFA'
          SENSTATS_COMMITTEE_MEMBERSHIP_URLS: ${{ vars.SENSTATS_COMMITTEE_MEMBERSHIP_URLS || '' }}
          SENSTATS_SKIP_COMMITTEE_DIRECTORY_PAGE: ${{ vars.SENSTATS_SKIP_COMMITTEE_DIRECTORY_PAGE || '' }}
          SENSTATS_SKIP_COMMITTEE_PAGE_FALLBACK: ${{ vars.SENSTATS_SKIP_COMMITTEE_PAGE_FALLBACK || '' }}
          SENSTATS_WRITE_COMMITTEE_DEBUG_HTML: ${{ vars.SENSTATS_WRITE_COMMITTEE_DEBUG_HTML || '' }}
          SENSTATS_COMMITTEE_MEMBERSHIP_TIMEOUT: ${{ vars.SENSTATS_COMMITTEE_MEMBERSHIP_TIMEOUT || '' }}
          SENSTATS_COMMITTEE_RETRY_ATTEMPTS: ${{ vars.SENSTATS_COMMITTEE_RETRY_ATTEMPTS || '' }}
          SENSTATS_COMMITTEE_EMPTY_ABORT_AFTER: ${{ vars.SENSTATS_COMMITTEE_EMPTY_ABORT_AFTER || '' }}
          SENSTATS_COMMITTEE_MIN_MEMBER_COUNT: ${{ vars.SENSTATS_COMMITTEE_MIN_MEMBER_COUNT || '' }}
          SENSTATS_ATTENDANCE_TIMEOUT: ${{ vars.SENSTATS_ATTENDANCE_TIMEOUT || '' }}
          SENSTATS_ATTENDANCE_RETRY_ATTEMPTS: ${{ vars.SENSTATS_ATTENDANCE_RETRY_ATTEMPTS || '' }}
          SENSTATS_REQUEST_TIMEOUT: ${{ vars.SENSTATS_REQUEST_TIMEOUT || '' }}
          SENSTATS_REQUEST_DELAY_SECONDS: ${{ vars.SENSTATS_REQUEST_DELAY_SECONDS || '' }}
          SENSTATS_REQUEST_DELAY_JITTER_SECONDS: ${{ vars.SENSTATS_REQUEST_DELAY_JITTER_SECONDS || '' }}
          SENSTATS_REQUEST_RETRY_ATTEMPTS: ${{ vars.SENSTATS_REQUEST_RETRY_ATTEMPTS || '' }}
          SENSTATS_REQUEST_RETRY_BACKOFF_SECONDS: ${{ vars.SENSTATS_REQUEST_RETRY_BACKOFF_SECONDS || '' }}

      - name: Upload ingestion debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: senstats-ingestion-log
          path: |
            senstats_ingest_errors.log
            senstats_committee_*_debug.html
          if-no-files-found: ignore
