name: SenStats Daily Data Sync

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-senstats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-senstats.txt

      - name: Install ingestion dependencies
        run: pip install -r scripts/requirements-senstats.txt

      - name: Run SenStats ingestion
        run: python scripts/senstats_ingest.py
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SENSTATS_CONTACT_EMAIL: ${{ secrets.SENSTATS_CONTACT_EMAIL }}
          SENSTATS_PROACTIVE_XHR_URL: ${{ secrets.SENSTATS_PROACTIVE_XHR_URL || vars.SENSTATS_PROACTIVE_XHR_URL }}
          SENSTATS_MAX_PROACTIVE_XHR_ATTEMPTS: ${{ vars.SENSTATS_MAX_PROACTIVE_XHR_ATTEMPTS || '80' }}
          SENSTATS_PROACTIVE_TIMEOUT: ${{ vars.SENSTATS_PROACTIVE_TIMEOUT || '10' }}
          SENSTATS_PROACTIVE_ROUTE_FALLBACKS: ${{ vars.SENSTATS_PROACTIVE_ROUTE_FALLBACKS || 'false' }}
          SENSTATS_CHECK_STATIC_PROACTIVE_PAGES: ${{ vars.SENSTATS_CHECK_STATIC_PROACTIVE_PAGES || 'false' }}
          SENSTATS_STATIC_PROACTIVE_TIMEOUT: ${{ vars.SENSTATS_STATIC_PROACTIVE_TIMEOUT || '8' }}
          SENSTATS_USE_COMMITTEE_FALLBACK: ${{ vars.SENSTATS_USE_COMMITTEE_FALLBACK || 'true' }}
          SENSTATS_COMMITTEE_TIMEOUT: ${{ vars.SENSTATS_COMMITTEE_TIMEOUT || '10' }}
          SENSTATS_COMMITTEE_IDS: ${{ vars.SENSTATS_COMMITTEE_IDS || '' }}
          SENSTATS_COMMITTEE_MEMBERSHIP_URLS: ${{ vars.SENSTATS_COMMITTEE_MEMBERSHIP_URLS || '' }}
          SENSTATS_SKIP_COMMITTEE_PAGE_FALLBACK: ${{ vars.SENSTATS_SKIP_COMMITTEE_PAGE_FALLBACK || 'true' }}
          SENSTATS_ATTENDANCE_TIMEOUT: ${{ vars.SENSTATS_ATTENDANCE_TIMEOUT || '10' }}
          SENSTATS_REQUEST_TIMEOUT: ${{ vars.SENSTATS_REQUEST_TIMEOUT || '20' }}

      - name: Upload ingestion error log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: senstats-ingestion-log
          path: senstats_ingest_errors.log
          if-no-files-found: ignore
